server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        # Route 1: Demo endpoint forward to httpbin for easy testing
        - id: orchid-service-route
          uri: https://httpbin.org
          predicates:
            - Path=/api/orchids/**
          filters:
            # StripPrefix để rewrite /api/orchids/1 thành /anything/1
            - StripPrefix=2
            - PrefixPath=/anything
            # Bộ lọc Rate Limiter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
