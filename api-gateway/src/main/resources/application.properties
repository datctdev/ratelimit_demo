# ===================================================================
# 1. CAU HINH CONG CHAY & TEN UNG DUNG API GATEWAY
# ===================================================================
server.port=8080
spring.application.name=api-gateway

# ===================================================================
# 2. CAU HINH KET NOI REDIS (LUU TRANG THAI TOKEN BUCKET PHAN TAN)
# Khi chay tren Docker Compose, REDIS_HOST=redis. Khi chay IDE, mac dinh localhost
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# URL cua Microservice Orchid-Service phia sau Gateway
orchid.service.url=${ORCHID_SERVICE_URL:http://localhost:8082}

# ===================================================================
# 3. ROUTE 1: SU DUNG SPRING CLOUD GATEWAY REQUEST-RATE-LIMITER + REDIS
# URL goi: http://localhost:8080/api/redis/orchids
# - burstCapacity = 10 : Thung chua toi da 10 tokens (Cho phep 10 requests lien tiep)
# - replenishRate = 1  : Moi giay nap them 1 token moi vao thung
# - requestedTokens = 1: Moi request tieu ton 1 token
# ===================================================================
spring.cloud.gateway.routes[0].id=redis-ratelimit-route
spring.cloud.gateway.routes[0].uri=${orchid.service.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/redis/orchids/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[0].filters[1]=PrefixPath=/api
spring.cloud.gateway.routes[0].filters[2].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[2].args.key-resolver=#{@ipKeyResolver}
spring.cloud.gateway.routes[0].filters[2].args.redis-rate-limiter.replenishRate=1
spring.cloud.gateway.routes[0].filters[2].args.redis-rate-limiter.burstCapacity=10
spring.cloud.gateway.routes[0].filters[2].args.redis-rate-limiter.requestedTokens=1

# ===================================================================
# 4. ROUTE 2: SU DUNG THU VIEN BUCKET4J CUSTOM FILTER (JAVA IN-MEMORY)
# URL goi: http://localhost:8080/api/bucket4j/orchids
# Duoc kiem soat truc tiep boi class Bucket4jRateLimitFilter.java
# ===================================================================
spring.cloud.gateway.routes[1].id=bucket4j-ratelimit-route
spring.cloud.gateway.routes[1].uri=${orchid.service.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/bucket4j/orchids/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[1].filters[1]=PrefixPath=/api

# ===================================================================
# 5. ROUTE 3: KHONG GIOI HAN (DUNG DE SO SANH KHI KHONG CO BAO VE)
# URL goi: http://localhost:8080/api/unlimited/orchids
# ===================================================================
spring.cloud.gateway.routes[2].id=unlimited-route
spring.cloud.gateway.routes[2].uri=${orchid.service.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/unlimited/orchids/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[2].filters[1]=PrefixPath=/api

# ===================================================================
# 6. CAU HINH ACTUATOR & LOGGING
# ===================================================================
management.endpoints.web.exposure.include=health,info,gateway,metrics
logging.level.org.springframework.cloud.gateway=INFO
